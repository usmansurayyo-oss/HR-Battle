<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HR Battle — Общая комната</title>
<style>
:root{color-scheme:dark;--bg:#101528;--surface:#1b2540;--line:#34435f;--mint:#6de6bd;--text:#f4f7ff;--mute:#b9c8e0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#1c3150,#101528 55%);font:16px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh}main{max-width:800px;margin:auto;padding:20px 14px 90px}h1{font-size:2rem;margin:8px 0}h2{font-size:1.4rem;margin:6px 0 14px}h3{margin:6px 0}p,.sub{color:var(--mute)}.card{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:18px;margin:14px 0;box-shadow:0 9px 28px #0002}.eyebrow{font-weight:900;letter-spacing:1.6px;font-size:12px;color:var(--mint)}button,input,select{font:inherit}input,select{display:block;background:#10192e;color:white;border:1px solid #526683;border-radius:12px;width:100%;padding:13px;margin:7px 0 14px}label{font-size:14px;color:#d9e7f9}button{border:0;border-radius:12px;padding:13px 16px;min-height:46px;background:var(--mint);color:#102133;font-weight:800;cursor:pointer}button:disabled{opacity:.4}button.alt{background:#2e3d5e;color:white;border:1px solid #51617e}button.danger{background:#632842;color:white}.full{width:100%}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{border:1px solid #61728d;border-radius:30px;padding:5px 10px;color:#ccd8e9;font-size:12px}.option{display:block;width:100%;margin:9px 0;background:#111e36;border:2px solid #344b65;color:white;text-align:left}.option strong{display:block}.option span{display:block;color:#bacbe0;font-weight:400;font-size:14px;margin-top:5px}.option.selected{border-color:var(--mint);background:#1c514d}.notice{background:#142e40;border:1px solid #338a89;border-radius:12px;padding:13px;margin:12px 0}.error{background:#4a2438;border-color:#a84661}.stats{display:flex;gap:8px}.stat{flex:1;min-width:0;background:#101c31;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat small{font-size:11px;color:var(--mute)}.progress{height:9px;background:#101729;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--mint)}.team{padding:12px 0;border-bottom:1px solid #394764}.team:last-child{border-bottom:0}.mini{font-size:13px;color:#b7c9df}.link{word-break:break-all;font-size:13px;background:#101929;border-radius:9px;padding:12px}details{margin:18px 0}.count{color:var(--mint)}
</style></head><body><main id="app"><h1>HR Battle</h1><p>Загрузка игры...</p></main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
'use strict';
const rounds=[
{title:'Найми лучших',topic:'Подбор и расстановка персонала',story:'Крупный клиент заказал цифровой проект. Команде срочно нужен менеджер проекта. Какого кандидата выбрать?',opts:[['Опытный профессионал','Стоимость 24 млн сумов. Высокая квалификация и быстрый запуск.',-24,19,3],['Перспективный выпускник','Стоимость 12 млн. Потребуется наставник, но мотивация высокая.',-12,7,13],['Сотрудник по рекомендации','Стоимость 17 млн. Знаком с компанией, но опыт ограничен.',-17,11,9]],challenge:'Объясните: какие компетенции важнее диплома и почему ваш выбор выгоден компании?',event:'Новый клиент требует результат раньше срока: если эффективность ниже 58, компания теряет ещё 7 баллов эффективности.'},
{title:'Первые 90 дней',topic:'Адаптация персонала',story:'Новый сотрудник растерян: нет чёткого плана, наставника и обратной связи. Как построить адаптацию?',opts:[['Ничего не менять','Нулевые расходы, но высокий риск увольнения.',0,-9,-15],['Наставник + план 30–60–90','Инвестиция 12 млн, хорошие результаты.',-12,13,18],['Интенсивный HR-онбординг','Инвестиция 20 млн, высокая вовлечённость.',-20,18,24]],challenge:'Назовите три измеримых показателя успешной адаптации.',event:'Сотрудник получил предложение конкурента: если лояльность ниже 58, потери 8 млн и 8 баллов эффективности.'},
{title:'Кризис команды',topic:'Мотивация и управление трудовой деятельностью',story:'Три сотрудника перегружены, качество работы упало. Лучший специалист готов уволиться. Ваше решение?',opts:[['Повысить всем зарплату','Затраты 25 млн, быстрое снятие напряжения.',-25,7,18],['Перераспределить задачи и KPI','Затраты 7 млн, улучшение процессов и прозрачности.',-7,19,12],['Провести командные встречи','Затраты 4 млн, заметный эффект для доверия, но слабее для продуктивности.',-4,6,16]],challenge:'Предложите два KPI и способ избежать несправедливой оценки.',event:'Неожиданный срочный заказ: если эффективность ниже 70, штраф 10 млн из бюджета.'},
{title:'Вырасти лидера',topic:'Обучение, карьера и кадровый резерв',story:'Открылась вакансия руководителя отдела. Два сильных сотрудника рассчитывают на повышение.',opts:[['Повысить самого результативного','Дёшево, но лидерские навыки ещё не проверены.',-4,10,-4],['Оценка компетенций + обучение','Потратить 15 млн на развитие и прозрачный конкурс.',-15,15,20],['Нанять руководителя со стороны','Быстрый старт, но сотрудники разочарованы.',-22,16,-12]],challenge:'Назовите критерии кадрового резерва и составьте карьерный шаг на 6 месяцев.',event:'Компания получила грант: при лояльности 75 и выше добавьте 12 млн к бюджету.'},
{title:'Будущее HR',topic:'HR-аналитика, цифровизация и этика',story:'Совет директоров требует снизить текучесть персонала. На столе три инвестиционных проекта.',opts:[['ИИ-подбор без контроля','Затраты 10 млн, продуктивность растёт, но доверие падает.',-10,15,-15],['HR-аналитика + защита данных','Затраты 18 млн, устойчивый рост качества решений.',-18,17,19],['Только корпоративные праздники','Затраты 8 млн, лояльность растёт, но процессы не меняются.',-8,1,10]],challenge:'Какие HR-данные допустимо собирать и как защитить права сотрудников?',event:'Проверка репутации работодателя: если лояльность ниже 65, штраф 12 баллов к общему результату.'}
];

const names=['TechNova','MarketPro','LogiSmart'];const $=document.getElementById('app');
const roomFromHash=()=>{let m=location.hash.match(/room=([A-Z0-9]{6})/i);return m?m[1].toUpperCase():''};
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const rand=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const score=c=>c.money+c.eff+c.loyal;const fresh=()=>({turn:0,phase:'lobby',companies:names.map(name=>({name,money:100,eff:50,loyal:50,history:[]})),players:{},votes:{},finished:false});
let peer=null,hostConn=null,conns={},mode='',room=roomFromHash(),name='',team=0,me='',game=fresh(),alertText='',online=false;
function header(){return `<div class="eyebrow">🎮 HR BATTLE · ЖИВАЯ ИГРА</div><h1>Битва за таланты</h1><div class="row"><span class="pill">10–12 студентов · 3 команды</span><span class="pill">5 раундов · 60 минут</span></div>`}
function notice(){return alertText?`<div class="notice error">${esc(alertText)}</div>`:''}
function landing(){return header()+notice()+`<div class="card"><h2>Преподаватель</h2><p>Создай одну общую комнату и отправь ссылку студентам. Твой телефон должен оставаться на странице игры.</p><button class="full" onclick="createRoom()">Создать игровую комнату</button></div><div class="card"><h2>Студент</h2><label>Код комнаты</label><input id="code" autocomplete="off" maxlength="6" value="${esc(room)}" placeholder="Например AB12CD"><label>Имя студента</label><input id="student" maxlength="32" placeholder="Имя и фамилия"><label>Команда</label><select id="team"><option value="0">TechNova</option><option value="1">MarketPro</option><option value="2">LogiSmart</option></select><button class="full" onclick="joinRoom()">Присоединиться</button></div><p class="mini">Нужен интернет. Работает в мобильном браузере; приложение устанавливать не надо.</p>`}
function roomLink(){return location.href.split('#')[0]+'#room='+room}
function playerCount(){return Object.keys(game.players).length}
function hostView(){let counts=names.map((_,i)=>Object.values(game.players).filter(p=>p.team===i).length);let votes=Object.values(game.votes[game.turn]||{});let r=rounds[game.turn];let link=roomLink();return header()+notice()+`<div class="card"><div class="row"><h2>👩‍🏫 Ведущая · ${room}</h2><span class="pill">${online?'🟢 Онлайн':'🟠 Соединение...'}</span></div><p>Ссылка для студентов</p><div class="link">${esc(link)}</div><button style="margin-top:9px" class="full" onclick="copyLink()">📋 Скопировать ссылку</button><p class="mini">Отправь ссылку в Telegram. Студенты выбирают команду и вводят имя.</p><div class="row"><strong>Подключилось: <span class="count">${playerCount()}</span> / 12</strong><span class="pill">${game.phase==='lobby'?'Ожидание':'Раунд '+(game.turn+1)+'/5'}</span></div>${names.map((n,i)=>`<div class="team"><b>${esc(n)}</b> · ${counts[i]} участников<div class="mini">${Object.values(game.players).filter(p=>p.team===i).map(p=>esc(p.name)+(p.connected?' 🟢':' ⚪')).join(', ')||'Пока никого'}</div></div>`).join('')}</div>`+(game.phase==='lobby'?`<div class="card"><h2>Начать занятие</h2><p>После того как участники присоединятся, запускай игру.</p><button class="full" onclick="start()" ${playerCount()===0?'disabled':''}>▶️ Начать игру</button></div>`:game.finished?finalView():`<div class="card"><div class="row"><span class="pill">Раунд ${game.turn+1} из 5</span><span class="pill">${esc(r.topic)}</span></div><h2>${esc(r.title)}</h2><p>${esc(r.story)}</p><p class="mini">🎤 Вопрос командам: ${esc(r.challenge)}</p><h3>Ответы: ${votes.length} / ${playerCount()}</h3>${names.map((n,i)=>{let v=votes.filter(x=>x.team===i);let ct=counts[i];return `<div class="team"><b>${n}</b> — ${v.length}/${ct} голосов<div class="mini">${r.opts.map((o,k)=>`${'ABC'[k]}: ${v.filter(x=>x.choice===k).length}`).join(' · ')}</div></div>`}).join('')}<p class="mini">Вариант команды определяется большинством голосов. Если голоса равны — выигрывает вариант с меньшим индексом (А, затем Б).</p><button class="full" onclick="advance()" ${votes.length===0?'disabled':''}>${game.turn===4?'🏆 Завершить и объявить победителя':'Применить решения → следующий раунд'}</button></div>`)+leaderboard()+`<details><summary>Управление игрой</summary><div class="card"><button class="alt full" onclick="downloadResults()">Скачать результаты</button><button class="danger full" style="margin-top:12px" onclick="resetGame()">Начать заново</button></div></details>`}
function leaderboard(){return `<div class="card"><h2>📊 Рейтинг компаний</h2>${[...game.companies].sort((a,b)=>score(b)-score(a)).map((c,i)=>`<div class="team"><div class="row"><b>${['🥇','🥈','🥉'][i]} ${esc(c.name)}</b><strong>${score(c)} очков</strong></div><div class="stats"><div class="stat"><b>${c.money}</b><small>млн сумов</small></div><div class="stat"><b>${c.eff}</b><small>эффективность</small></div><div class="stat"><b>${c.loyal}</b><small>лояльность</small></div></div></div>`).join('')}</div>`}
function finalView(){return `<div class="card"><h2>🏆 Игра завершена!</h2><p>Побеждает команда с максимальной суммой бюджета, эффективности и лояльности.</p></div>`}
function studentView(){let p=game.players[me],r=rounds[game.turn],v=(game.votes[game.turn]||{})[me];return header()+notice()+`<div class="card"><div class="row"><strong>👤 ${esc(name)}</strong><span class="pill">${online?'🟢 На связи':'🟠 Подключаемся'}</span></div><p>Команда: <b>${esc(names[team])}</b> · комната ${room}</p></div>`+(game.phase==='lobby'?`<div class="card"><h2>Ожидание преподавателя</h2><p>Вы присоединились. Скоро начнётся первый раунд!</p><p>Участников в игре: ${playerCount()}</p></div>`:game.finished?finalView()+leaderboard():`<div class="card"><span class="pill">Раунд ${game.turn+1} из 5</span><h2>${esc(r.title)}</h2><p>${esc(r.story)}</p><div class="progress"><div style="width:${(game.turn+1)*20}%"></div></div><h3>Как поступит ваша компания?</h3>${r.opts.map((o,i)=>`<button class="option ${v&&v.choice===i?'selected':''}" ${v?'disabled':''} onclick="vote(${i})"><strong>${'ABC'[i]}. ${esc(o[0])}</strong><span>${esc(o[1])}</span></button>`).join('')}${v?`<div class="notice">✅ Ответ отправлен. Дождись следующего раунда.</div>`:''}</div><div class="card"><h3>🎤 Обоснуй решение</h3><p>${esc(r.challenge)}</p></div>`)+leaderboard()}
function render(){if(mode==='host')$.innerHTML=hostView();else if(mode==='student'&&me&&game.players[me])$.innerHTML=studentView();else $.innerHTML=landing()}
function createRoom(){if(!window.Peer){alertText='Не загрузилась служба соединения. Проверь интернет и обнови страницу.';render();return}room=rand();mode='host';game=fresh();me='';location.hash='room='+room;startPeer()}
function startPeer(){alertText='';online=false;render();let id='hrbattle26-'+room.toLowerCase()+'-host';peer=new Peer(id,{debug:0});peer.on('open',()=>{online=true;render()});peer.on('connection',conn=>{conns[conn.peer]=conn;setupHostConn(conn)});peer.on('error',e=>{online=false;alertText='Сбой подключения: '+(e.type==='unavailable-id'?'код занят. Создай другую комнату.':'проверь интернет и перезагрузи страницу.');render()});peer.on('disconnected',()=>{online=false;render();try{peer.reconnect()}catch(e){}})}
function setupHostConn(conn){conn.on('open',()=>{conn.send({type:'state',game});render()});conn.on('data',d=>{if(!d||typeof d!=='object')return;if(d.type==='join'){let id=String(d.id||'').slice(0,90);if(!id)return;let t=Number(d.team);if(!Number.isInteger(t)||t<0||t>2)return;game.players[id]={name:String(d.name||'Студент').slice(0,32),team:t,connected:true,peer:conn.peer};conn.studentId=id;broadcast()}else if(d.type==='vote'){let id=conn.studentId;if(!id||game.finished||game.phase!=='playing')return;let choice=Number(d.choice);if(!Number.isInteger(choice)||choice<0||choice>2)return;game.votes[game.turn]??={};if(game.votes[game.turn][id])return;game.votes[game.turn][id]={team:game.players[id].team,choice};broadcast()}});conn.on('close',()=>{if(conn.studentId&&game.players[conn.studentId])game.players[conn.studentId].connected=false;broadcast()});conn.on('error',()=>{})}
function broadcast(){Object.values(conns).forEach(c=>{if(c.open)try{c.send({type:'state',game})}catch(e){}});render()}
function start(){if(mode!=='host'||playerCount()===0)return;game.phase='playing';broadcast()}
function applyTeam(i,choice){let c=game.companies[i],o=rounds[game.turn].opts[choice];c.money+=o[2];c.eff=Math.max(0,c.eff+o[3]);c.loyal=Math.max(0,c.loyal+o[4]);c.history.push({round:game.turn+1,choice:o[0]})}
function applyEvent(){game.companies.forEach(c=>{switch(game.turn){case 0:if(c.eff<58)c.eff-=7;break;case 1:if(c.loyal<58){c.money-=8;c.eff-=8}break;case 2:if(c.eff<70)c.money-=10;break;case 3:if(c.loyal>=75)c.money+=12;break;case 4:if(c.loyal<65)c.eff-=12}})}
function advance(){if(mode!=='host')return;let votes=Object.values(game.votes[game.turn]||{});if(!votes.length)return;if(!confirm('Завершить раунд и учесть решения команд?'))return;for(let t=0;t<3;t++){let vs=votes.filter(v=>v.team===t);if(!vs.length)continue;let cnt=[0,1,2].map(i=>vs.filter(v=>v.choice===i).length);let best=cnt.indexOf(Math.max(...cnt));applyTeam(t,best)}applyEvent();if(game.turn===4){game.finished=true;game.phase='finished'}else game.turn++;broadcast()}
function vote(choice){if(mode!=='student'||!hostConn?.open)return;hostConn.send({type:'vote',choice})}
function copyLink(){let val=roomLink();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(val).then(()=>alert('Ссылка скопирована')).catch(()=>prompt('Скопируй ссылку',val));else prompt('Скопируй ссылку',val)}
function joinRoom(){if(!window.Peer){alertText='Не загрузилась служба соединения. Проверь интернет.';render();return}let code=document.getElementById('code').value.trim().toUpperCase(),user=document.getElementById('student').value.trim(),t=+document.getElementById('team').value;if(!/^[A-Z0-9]{6}$/.test(code)||!user){alertText='Введи шестизначный код комнаты и своё имя.';render();return}room=code;name=user;team=t;me=sessionStorage.getItem('hrbattle-player-'+room)||('p'+rand()+rand());sessionStorage.setItem('hrbattle-player-'+room,me);mode='student';location.hash='room='+room;connectStudent()}
function connectStudent(){alertText='';online=false;render();peer=new Peer(undefined,{debug:0});peer.on('open',()=>{hostConn=peer.connect('hrbattle26-'+room.toLowerCase()+'-host',{reliable:true});hostConn.on('open',()=>{online=true;hostConn.send({type:'join',id:me,name,team});render()});hostConn.on('data',d=>{if(d?.type==='state'){game=d.game;render()}});hostConn.on('close',()=>{online=false;alertText='Связь с ведущей прервалась. Обнови страницу и войди повторно.';render()});hostConn.on('error',()=>{online=false;alertText='Не получилось войти. Проверь код и интернет.';render()})});peer.on('error',e=>{alertText='Комната не найдена или нет соединения. Проверь код и что преподаватель открыл игру.';render()})}
function downloadResults(){let txt='HR Battle · Комната '+room+'\n\n'+game.companies.map(c=>c.name+' · '+score(c)+' баллов\nБюджет '+c.money+', эффективность '+c.eff+', лояльность '+c.loyal+'\n'+c.history.map(h=>'Раунд '+h.round+': '+h.choice).join('\n')).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='HR_Battle_Results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetGame(){if(confirm('Удалить текущие результаты и начать заново?')){let players=game.players;game=fresh();game.players=players;broadcast()}}
render();
</script></body></html>
